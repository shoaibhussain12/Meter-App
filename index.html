<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Meter Reading App
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
 </head>
 <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
   <div class="flex items-center space-x-4 mb-6">
    <img alt="Company logo with dark green background and white text reading Logo" class="w-14 h-14 object-contain" height="60" src="img-kpslogo.jpg" width="60"/>
    <h1 class="text-2xl font-bold text-[#004d00]">
     Karachi Public School
    </h1>
   </div>
   <form class="space-y-5" id="meterForm">
    <div>
     <label class="block text-gray-700 font-semibold mb-1" for="branch">
      Branch Name
     </label>
     <input class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" id="branch" name="branch" placeholder="Enter branch name" required="" type="text"/>
    </div>
    <div>
     <label class="block text-gray-700 font-semibold mb-1" for="date">
      Date
     </label>
     <input class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" id="date" name="date" required="" type="date"/>
    </div>
    <div>
     <label class="block text-gray-700 font-semibold mb-1" for="time">
      Time
     </label>
     <input class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" id="time" name="time" required="" type="time"/>
    </div>
    <div class="grid grid-cols-2 gap-4">
     <div>
      <label class="block text-gray-700 font-semibold mb-1" for="morningTime">
       Morning Time
      </label>
      <input class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" id="morningTime" name="morningTime" required="" type="time"/>
     </div>
     <div>
      <label class="block text-gray-700 font-semibold mb-1" for="morningReading">
       Morning Time Reading Taken
      </label>
      <input class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" id="morningReading" min="0" name="morningReading" placeholder="Enter reading" required="" step="any" type="number"/>
     </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
     <div>
      <label class="block text-gray-700 font-semibold mb-1" for="eveningTime">
       Evening Time
      </label>
      <input class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" id="eveningTime" name="eveningTime" required="" type="time"/>
     </div>
     <div>
      <label class="block text-gray-700 font-semibold mb-1" for="eveningReading">
       Evening Time Reading Taken
      </label>
      <input class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" id="eveningReading" min="0" name="eveningReading" placeholder="Enter reading" required="" step="any" type="number"/>
     </div>
    </div>
    <div>
     <label class="block text-gray-700 font-semibold mb-1" for="totalUnits">
      Total Units
     </label>
     <input class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-100 cursor-not-allowed" id="totalUnits" name="totalUnits" placeholder="0" readonly="" type="text"/>
    </div>
    <button class="w-full bg-[#004d00] hover:bg-green-800 text-white font-semibold py-3 rounded-md transition-colors flex items-center justify-center space-x-2" id="calculateBtn" type="submit">
     <span>
      Results
     </span>
     <i class="fas fa-calculator">
     </i>
    </button>
   </form>
  </div>
  <script>
   const form = document.getElementById('meterForm');
    const morningReadingInput = document.getElementById('morningReading');
    const eveningReadingInput = document.getElementById('eveningReading');
    const totalUnitsInput = document.getElementById('totalUnits');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const morningReading = parseFloat(morningReadingInput.value);
      const eveningReading = parseFloat(eveningReadingInput.value);

      if (isNaN(morningReading) || isNaN(eveningReading)) {
        totalUnitsInput.value = 'Invalid readings';
        return;
      }

      if (eveningReading < morningReading) {
        totalUnitsInput.value = 'Evening reading must be >= morning reading';
        return;
      }

      const totalUnits = eveningReading - morningReading;
      totalUnitsInput.value = totalUnits.toFixed(2);
    });
  </script>
 </body>
</html>
